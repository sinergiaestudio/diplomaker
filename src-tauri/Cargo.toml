[package]
name = "diplomaker"
version = "2.2.0-2"
description = "Estudio local de diplomas y certificados"
authors = ["Marcelo Gomez"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "diplomaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
