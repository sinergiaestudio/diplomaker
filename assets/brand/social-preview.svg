    <path d="M40 6v9a4 4 0 0 0 4 4h7" fill="#7FA1C5" opacity=".72"/>
    <path d="M23 22v22h7.5C38 44 42 39.7 42 33s-4-11-11.5-11H23Zm6 5h1.4c3.8 0 5.8 2.1 5.8 6s-2 6-5.8 6H29V27Z" fill="#fff"/>
