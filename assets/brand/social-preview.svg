<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Diplomaker</title>
  <desc id="desc">Diseñá una vez. Emití con precisión. Estudio local y de código abierto para diseñar y emitir diplomas y certificados.</desc>
  <defs>
