      <stop stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="paper" x1="92" y1="102" x2="342" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#426F9F"/>
      <stop offset="1" stop-color="#244A75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#172033" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1160" cy="80" r="260" fill="#365F91" opacity=".05"/>
  <circle cx="1140" cy="600" r="330" fill="#B28A46" opacity=".045"/>
