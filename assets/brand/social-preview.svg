  </g>
  <text x="565" y="245" fill="#172033" font-family="Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-3">Diplomaker</text>
  <text x="570" y="315" fill="#365F91" font-family="Georgia, serif" font-size="39">Diseñá una vez. Emití con precisión.</text>
  <text x="572" y="385" fill="#687386" font-family="Arial, sans-serif" font-size="25">Estudio local y de código abierto para diseñar</text>
