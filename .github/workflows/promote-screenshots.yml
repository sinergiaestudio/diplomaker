name: Incorporar capturas verificadas

on:
  push:
    branches: ["release/2.2.0"]
    paths: [".github/workflows/promote-screenshots.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0
          fetch-depth: 0

      - name: Localizar la última prueba de interfaz exitosa
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --workflow ui.yml \
            --branch release/2.2.0 \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Prueba seleccionada: $run_id"

      - name: Descargar capturas verificadas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/diplomaker-ui
          gh run download "${{ steps.ui.outputs.run_id }}" --dir /tmp/diplomaker-ui
          find /tmp/diplomaker-ui -maxdepth 3 -type f -print

      - name: Actualizar documentación visual
        shell: bash
        run: |
          set -euo pipefail
          source_dir=$(find /tmp/diplomaker-ui -type f -name home-light.png -printf '%h\n' | head -n 1)
          test -n "$source_dir"
          mkdir -p docs/screenshots
          cp "$source_dir/home-light.png" docs/screenshots/home-light.png
          cp "$source_dir/home-dark.png" docs/screenshots/home-dark.png
          cp "$source_dir/review.png" docs/screenshots/review.png
          cp "$source_dir/projects.png" docs/screenshots/projects.png
          cp "$source_dir/studio.png" docs/screenshots/template-studio.png
          cp "$source_dir/mobile-home.png" docs/screenshots/mobile.png
          cp "$source_dir/mobile-more.png" docs/screenshots/mobile-more.png
          cp "$source_dir/results.json" docs/screenshots/ui-results.json

      - name: Confirmar capturas en la rama de lanzamiento
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Las capturas ya estaban actualizadas."
          else
            git commit -m "Incorporar capturas verificadas de Diplomaker 2.2"
            git push origin HEAD:release/2.2.0
          fi
