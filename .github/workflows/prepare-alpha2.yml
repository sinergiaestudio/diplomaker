# Reintento sin modificar workflows desde el token de Actions
name: Preparar Diplomaker 2.2 alpha 2

on:
  push:
    branches: ["release/2.2.0"]
    paths: [".github/workflows/prepare-alpha2.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diplomaker-prepare-alpha2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.2.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Actualizar versiones y documentación
        run: node tools/set-version.js 2.2.0-alpha.2 2.2.0-2

      - name: Verificar consistencia antes de confirmar
        run: npm run check

      - name: Confirmar alpha 2 en la rama de lanzamiento
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La rama ya estaba preparada para alpha 2."
          else
            git commit -m "Preparar Diplomaker 2.2.0-alpha.2"
            git push origin HEAD:release/2.2.0
          fi
