name: Diplomaker Desktop

on:
  push:
    branches: ["release/**"]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "styles/**"
      - "assets/**"
      - "tools/**"
      - "index.html"
      - "package.json"
      - "manifest.webmanifest"
      - "version.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "styles/**"
      - "assets/**"
      - "tools/**"
      - "index.html"
      - "package.json"
      - "manifest.webmanifest"
      - "version.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diplomaker-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Instalar Tauri CLI
        run: npm install --ignore-scripts
      - name: Control integral
        run: npm run check
      - name: Probar reglas de persistencia
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compilar NSIS y MSI
        run: npm run desktop:build -- --bundles nsis,msi
      - name: Probar arranque del ejecutable portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'src-tauri/target/release/diplomaker.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Diplomaker se cerró durante la prueba de arranque. Código: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Diplomaker permaneció activo durante la prueba de arranque."
      - name: Verificar instaladores
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw 'No se encontraron ambos instaladores.' }
          if ($nsis.Length -lt 1MB) { throw 'El instalador NSIS tiene un tamaño inesperadamente pequeño.' }
          if ($msi.Length -lt 1MB) { throw 'El instalador MSI tiene un tamaño inesperadamente pequeño.' }
          Get-FileHash $nsis.FullName -Algorithm SHA256
          Get-FileHash $msi.FullName -Algorithm SHA256
      - name: Subir instaladores y ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Diplomaker-Windows-x64
          path: |
            src-tauri/target/release/diplomaker.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
