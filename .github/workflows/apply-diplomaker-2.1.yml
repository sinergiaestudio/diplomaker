# Publicación de Diplomaker 2.1 · recuperación robusta de fragmentos
name: Aplicar Diplomaker 2.1

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-diplomaker-2.1.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diplomaker-2-1-release
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconstruir, aplicar y verificar Diplomaker 2.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def clean(path):
              text = Path(path).read_text(encoding='utf-8')
              return ''.join(ch for ch in text if ch in alphabet)

          def find_window(text, length, expected_hash, label):
              for start in range(0, len(text) - length + 1):
                  candidate = text[start:start + length]
                  if hashlib.sha256(candidate.encode()).hexdigest() == expected_hash:
                      print(f'{label}: segmento recuperado en posición {start}')
                      return candidate
              raise SystemExit(f'No se encontró el segmento íntegro {label}')

          parts = [clean(f'.github/dm21/part-{i:02d}') for i in range(8)]
          expected_segment_hashes = [
              '74f4880011e9a69a8e7bab2d1eb1130ed81197ca5b8dc66b939f0cf6b9d65e7d',
              'd7ab99f31db3266c3c7a4304881a5f3a839a34862a04cebf37813cc3e7641df8',
              '302793f9b2958492cf6171c107904d64730a0957fc1245cf504840a37472fed3',
              '63ca61870416547ba4c5efc5d4fabdf7da363059682ce496694f2e87c24cf230',
              'f924cedb11c46af9c5b5fb5eccfa7c5f5d316204531a1c2b29d5e7f15c0b782d',
              '49a864b792f16e1e6dadd97634d0c782ad55ae6521639301fead2e8081a71759',
              '7e3a11d946ae037289fb99d3305f484414863d71abbd8d5b9897a8beb3e777ae',
              'b2bbd2c0fd84f0f4e66e9881904ec74206718a225efc1d856d6b6628f2293dbe',
          ]

          segments = []
          for i in range(5):
              if len(parts[i]) != 7000 or hashlib.sha256(parts[i].encode()).hexdigest() != expected_segment_hashes[i]:
                  raise SystemExit(f'Segmento {i} inválido')
              segments.append(parts[i])

          combined_tail = parts[5] + parts[6] + parts[7]
          segments.append(find_window(combined_tail, 7000, expected_segment_hashes[5], 'segmento 5'))
          segments.append(find_window(combined_tail, 7000, expected_segment_hashes[6], 'segmento 6'))
          segments.append(find_window(combined_tail, 5872, expected_segment_hashes[7], 'segmento 7'))

          payload = ''.join(segments)
          if len(payload) != 54872:
              raise SystemExit(f'Longitud Base64 inesperada: {len(payload)}')
          data = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected_zip_hash = '7e86c56f74f4b004a148c5b1286f96154a538155000a1e9c4d62a35e3b29852b'
          if digest != expected_zip_hash:
              raise SystemExit(f'SHA-256 incorrecto: {digest}')
          Path('/tmp/diplomaker-2.1.zip').write_bytes(data)
          print(f'Paquete verificado: {len(data)} bytes · {digest}')
          PY
          unzip -o /tmp/diplomaker-2.1.zip -d .
          rm -rf .github/dm21
          npm run check

      - name: Confirmar Diplomaker 2.1 en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No había cambios pendientes."
          else
            git commit -m "Publicar Diplomaker 2.1 con Estudio de Plantillas"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
