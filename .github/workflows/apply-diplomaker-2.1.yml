# Diagnóstico y publicación definitiva de Diplomaker 2.1 · 25/08/2026
name: Aplicar Diplomaker 2.1

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-diplomaker-2.1.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diplomaker-2-1-release
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconstruir, aplicar y verificar Diplomaker 2.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def clean(path):
              text = Path(path).read_text(encoding='utf-8')
              return ''.join(ch for ch in text if ch in alphabet)

          parts = [clean(f'.github/dm21/part-{i:02d}') for i in range(8)]
          for i, part in enumerate(parts):
              print(f'PARTE {i}: len={len(part)} sha256={hashlib.sha256(part.encode()).hexdigest()} inicio={part[:16]} fin={part[-16:]}')

          payload = ''.join(parts[:5]) + parts[5][:7000] + parts[6][:7000] + parts[7][:5872]
          print(f'PAYLOAD: len={len(payload)} sha256-texto={hashlib.sha256(payload.encode()).hexdigest()}')
          if len(payload) != 54872:
              raise SystemExit(f'Longitud Base64 inesperada: {len(payload)}')
          data = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = '7e86c56f74f4b004a148c5b1286f96154a538155000a1e9c4d62a35e3b29852b'
          if digest != expected:
              raise SystemExit(f'SHA-256 incorrecto: {digest}')
          Path('/tmp/diplomaker-2.1.zip').write_bytes(data)
          print(f'Paquete verificado: {len(data)} bytes · {digest}')
          PY
          unzip -o /tmp/diplomaker-2.1.zip -d .
          rm -rf .github/dm21
          npm run check

      - name: Confirmar Diplomaker 2.1 en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No había cambios pendientes."
          else
            git commit -m "Publicar Diplomaker 2.1 con Estudio de Plantillas"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
