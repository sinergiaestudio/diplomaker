name: Control de calidad

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: diplomaker-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verificar estructura, identidad, sintaxis y sanitización
        run: npm run check
      - name: Preparar recursos web
        run: node tools/build-web.js
      - name: Preparar recursos de escritorio
        run: npm run build:desktop
      - name: Subir vista previa web
        uses: actions/upload-artifact@v4
        with:
          name: Diplomaker-Web-Preview
          path: dist-web
          if-no-files-found: error
          retention-days: 7
