name: Publicar versión de Diplomaker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente para publicar"
        required: true
        type: string

permissions:
  contents: write

jobs:
  web:
    name: Versión web portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Preparar paquete web
        run: npm run build:web
      - name: Empaquetar versión portable
        shell: bash
        run: |
          cd dist-web
          zip -9 -r ../Diplomaker-Web-Portable.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Diplomaker-Web-Portable
          path: Diplomaker-Web-Portable.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Instalar Tauri CLI
        run: npm install --ignore-scripts
      - name: Verificar y compilar
        run: |
          npm run check
          npm run desktop:build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: Diplomaker-Windows-x64
          path: |
            src-tauri/target/release/diplomaker.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Normalizar nombres y calcular verificaciones
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            cp "$file" "final/$name"
          done
          (cd final && sha256sum * > SHA256SUMS.txt)
          ls -lah final
      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [[ "$TAG_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" final/* --clobber
          else
            gh release create "$TAG_NAME" final/* \
              --title "Diplomaker ${TAG_NAME#v}" \
              --generate-notes \
              $PRERELEASE
          fi
